# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  scrollHeight: 4
  scrollPastBottom: false
  sidePanelWidth: 0.25
  expandFocusedSidePanel: true
  enlargedSideViewLocation: top
  border: rounded
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  commandLogSize: 5
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  filterMode: fuzzy
  fileTreeSortOrder: foldersFirst
  theme:
    activeBorderColor: ["#ffcfa8", "bold"]
    inactiveBorderColor: ["#505050"]
    searchingActiveBorderColor: ["#ffc799", "bold"]
    optionsTextColor: ["#b9aeda"]
    selectedLineBgColor: ["#161616"]
    inactiveViewSelectedLineBgColor: ["#343434"]
    cherryPickedCommitBgColor: ["#343434"]
    cherryPickedCommitFgColor: ["#ffcfa8"]
    unstagedChangesColor: ["#ff8080"]
    defaultFgColor: ["#cccccc"]
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  parseEmoji: true
os:
  editPreset: nvim
disableStartupPopups: true
notARepository: skip
promptToReturnFromSubprocess: false
# Lazygit's defaults already provide j/k, h/l, g/G-style navigation.
keybinding:
  universal:
    prevPage: K
    nextPage: J
    scrollUpMain-alt1: <c-u>
    scrollDownMain-alt1: <c-d>
