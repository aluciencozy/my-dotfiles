# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  scrollHeight: 4
  scrollPastBottom: false
  sidePanelWidth: 0.25
  expandFocusedSidePanel: true
  enlargedSideViewLocation: top
  border: rounded
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  commandLogSize: 5
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  filterMode: fuzzy
  fileTreeSortOrder: foldersFirst
  theme:
    activeBorderColor: ["#c4a7e7", "bold"]
    inactiveBorderColor: ["#6e6a86"]
    searchingActiveBorderColor: ["#f6c177", "bold"]
    optionsTextColor: ["#9ccfd8"]
    selectedLineBgColor: ["#26233a"]
    inactiveViewSelectedLineBgColor: ["#403d52"]
    cherryPickedCommitBgColor: ["#403d52"]
    cherryPickedCommitFgColor: ["#c4a7e7"]
    unstagedChangesColor: ["#eb6f92"]
    defaultFgColor: ["#e0def4"]
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  parseEmoji: true
os:
  editPreset: nvim
disableStartupPopups: true
notARepository: skip
promptToReturnFromSubprocess: false
# Lazygit's defaults already provide j/k, h/l, g/G-style navigation.
keybinding:
  universal:
    prevPage: K
    nextPage: J
    scrollUpMain-alt1: <c-u>
    scrollDownMain-alt1: <c-d>
