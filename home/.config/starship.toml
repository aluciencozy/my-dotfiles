format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 2000
# Change this one line to "nord" to use the alternate palette below.
palette = "rose_pine_moon"

[directory]
style = 'bold fg:iris'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:foam'
symbol = ' '
format = '[on](text) [$symbol$branch ]($style)'

[git_status]
style = 'fg:love'
format = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ' '

[python]
style = 'fg:rose'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
style = 'fg:iris'
format = '[$symbol($version )]($style)'
symbol = ' '

[nodejs]
style = 'fg:foam'
symbol = ' '

[golang]
style = 'fg:pine'
symbol = ' '

[haskell]
style = 'fg:iris'
symbol = ' '

[rust]
style = 'fg:gold'
symbol = ' '

[ruby]
style = 'fg:rose'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'fg:gold'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:pine'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'fg:love'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:muted'
format = '[$duration]($style)'

[palettes.rose_pine_moon]
iris = '#C4A7E7'
foam = '#9CCFD8'
love = '#EB6F92'
rose = '#EA9A97'
gold = '#F6C177'
pine = '#3E8FB0'
muted = '#6E6A86'
text = '#E0DEF4'
base = '#232136'

[palettes.nord]
iris = '#B48EAD'
foam = '#88C0D0'
love = '#BF616A'
rose = '#D08770'
gold = '#EBCB8B'
pine = '#5E81AC'
muted = '#434C5E'
text = '#E7E7E7'
base = '#2E3440'
