onboarding = false

[theme]
name = "rose-pine"

auto_switch = false

[terminal]
default_shell = "zsh"

[keys]
prefix = "ctrl+space"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"
switch_workspace = "prefix+alt+1..9"
switch_tab = ""
focus_agent = "prefix+1..9"

[experimental]
pane_history = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
