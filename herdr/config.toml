onboarding = false

[theme]
name = "rose-pine"

# let the terminal background show through, like bg=default in tmux
auto_switch = false
[theme.custom]
# Let Herdr's panel and tab/sidebar surfaces inherit the terminal background.
panel_bg = "reset"
surface0 = "reset"
surface1 = "reset"
surface_dim = "reset"
# neutral white, matching the Ghostty/Neovim override
text = "#E7E7E7"

[terminal]
default_shell = "zsh"

[keys]
prefix = "ctrl+space"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"
switch_workspace = "prefix+alt+1..9"
switch_tab = ""
focus_agent = "prefix+1..9"

[experimental]
pane_history = false

[ui]
# Rose Pine iris for active borders, highlights, and navigation UI.
accent = "#C4A7E7"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
