onboarding = false

[theme]
name = "terminal"

# let the terminal background show through, like bg=default in tmux
auto_switch = false
[theme.custom]
panel_bg = "reset"
# neutral white, matching the Ghostty/Neovim override
text = "#E7E7E7"

[terminal]
default_shell = "zsh"

[keys]
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"
switch_workspace = "prefix+alt+1..9"
switch_tab = ""
focus_agent = "prefix+1..9"

[experimental]
pane_history = false

[ui]
# active pane border in Nord green, like the tmux active border
accent = "#A3BE8C"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
