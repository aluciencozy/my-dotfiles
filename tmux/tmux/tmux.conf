set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.tmux/plugins/'
source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g mouse on
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 100000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top
setw -g mode-keys vi

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#FFCFA8'
set -g @floax-text-color '#CCCCCC'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/home/alex/github/dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '/home/alex/github/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
# set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
run '~/.tmux/plugins/tpm/tpm'

# Vesper palette with the terminal background showing through.
set -g status-style 'bg=default,fg=#CCCCCC'
set -g status-left '#[fg=#99FFE4,bg=default] #S #[default]'
set -g status-right '#[fg=#A0A0A0,bg=default] #{b:pane_current_path} #(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify left
setw -g window-status-style 'fg=#A0A0A0,bg=default'
setw -g window-status-current-style 'fg=#FFCFA8,bg=default,bold'
setw -g window-status-activity-style 'fg=#99FFE4,bg=default'
setw -g window-status-separator ''
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, (zoom),} '
set -g pane-border-style 'fg=#505050,bg=default'
set -g pane-active-border-style 'fg=#FFCFA8,bg=default'
set -g message-style 'fg=#CCCCCC,bg=#161616'
set -g message-command-style 'fg=#CCCCCC,bg=#161616'
setw -g mode-style 'fg=#101010,bg=#FFCFA8'
