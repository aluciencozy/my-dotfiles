# ---------------------------------------------------------
# Basic tmux controls
# ---------------------------------------------------------

bind ^D detach
bind * list-clients
bind : command-prompt

# Reload config
bind C-l source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Override nvim Ctrl-A bind
bind a send-prefix

# ---------------------------------------------------------
# Pane navigation
# ---------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ---------------------------------------------------------
# Splits
# ---------------------------------------------------------

# Side-by-side
bind | split-window -h -c "#{pane_current_path}"

# Top / bottom
bind - split-window -v -c "#{pane_current_path}"


# ---------------------------------------------------------
# Pane resizing
# ---------------------------------------------------------

# No prefix required
bind-key -n M-Left  resize-pane -L 5
bind-key -n M-Right resize-pane -R 5
bind-key -n M-Up    resize-pane -U 2
bind-key -n M-Down  resize-pane -D 2


# ---------------------------------------------------------
# Close panes / windows
# ---------------------------------------------------------

# Prefix + Ctrl-X
bind C-x confirm-before -p "Kill this pane? (y/n)" kill-pane

# Prefix + X
bind X confirm-before -p "Kill this window? (y/n)" kill-window


# ---------------------------------------------------------
# Windows
# ---------------------------------------------------------

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Next / previous window with prefix
bind H previous-window
bind L next-window

# Next / previous window without prefix
bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window

# Reorder windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Rename current window
bind r display-popup -E \
  -w 45 \
  -h 7 \
  -x C \
  -y C \
  -T " Rename Window " \
  -s "bg=#24273a,fg=#cad3f5" \
  -S "fg=#c6a0f6" \
  'name=$(printf "" | fzf --phony --print-query --prompt="New name: " --border=none --layout=reverse | head -n1); [ -n "$name" ] && tmux rename-window "$name"' \
  \; if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-l'

# Window chooser
bind w choose-tree -Z -w


# ---------------------------------------------------------
# Sessions
# ---------------------------------------------------------

# Rename session
bind R display-popup -E \
  -w 45 \
  -h 7 \
  -x C \
  -y C \
  -T " Rename Session " \
  -s "bg=#24273a,fg=#cad3f5" \
  -S "fg=#c6a0f6" \
  'name=$(printf "" | fzf --phony --print-query --prompt="New name: " --border=none --layout=reverse | head -n1); [ -n "$name" ] && tmux rename-session "$name"' \
  \; if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-l'

# Session chooser
bind s choose-tree -Z -s

# Last window
bind ^A last-window

bind C-q confirm-before -p "Kill this session? (y/n)" kill-session

# ---------------------------------------------------------
# Misc
# ---------------------------------------------------------

# Zoom current pane
bind z resize-pane -Z

# Synchronize pane input
bind * setw synchronize-panes

# Toggle pane border status
bind P set pane-border-status

# Clear current shell
bind K send-keys "clear" \; send-keys "Enter"


# ---------------------------------------------------------
# Copy mode
# ---------------------------------------------------------

bind-key -T copy-mode-vi v send-keys -X begin-selection
