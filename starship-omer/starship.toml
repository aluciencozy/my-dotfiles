add_newline = true
format = """$directory$character"""
right_format = """$all"""
palette = "catppuccin_mocha"
command_timeout = 2000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:teal'
symbol = ' '
format = '[$symbol$branch(:$remote_branch)]($style)'

[python]
style = 'fg:peach'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
style = 'fg:mauve'
format = '[$symbol($version )]($style)'
symbol = ' '

[nodejs]
style = 'fg:green'
symbol = ' '

[golang]
style = 'fg:sapphire'
symbol = ' '

[haskell]
style = 'fg:mauve'
symbol = ' '

[rust]
style = 'fg:yellow'
symbol = ' '

[ruby]
style = 'fg:flamingo'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'fg:yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '

[docker_context]
symbol = ' '
style = 'fg:blue'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'fg:red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:overlay0'
format = '[$duration]($style)'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'
