add_newline = true
format = """$directory$character"""
right_format = """$all"""
palette = "shared"
command_timeout = 2000

[character]
vicmd_symbol = "[N](bold yellow) >>>"
success_symbol = '[➜](bold green)'

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:teal'
symbol = ' '
format = '[$symbol$branch(:$remote_branch)]($style) '

[gcloud]
disabled = true

[python]
style = 'fg:peach'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
style = 'fg:mauve'
format = '[$symbol($version )]($style)'
symbol = ' '

[nodejs]
style = 'fg:green'
symbol = ' '

[golang]
style = 'fg:sapphire'
symbol = ' '

[haskell]
style = 'fg:mauve'
symbol = ' '

[rust]
style = 'fg:yellow'
symbol = ' '

[ruby]
style = 'fg:flamingo'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'fg:yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '

[docker_context]
symbol = ' '
style = 'fg:blue'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'fg:red'
number_threshold = 1
format = '[$symbol]($style) '

[cmd_duration]
min_time = 500
style = 'fg:overlay0'
format = '[$duration]($style) '

[palettes.shared]
teal = '#ebbcba'
peach = '#f6c177'
mauve = '#c4a7e7'
green = '#31748f'
sapphire = '#9ccfd8'
yellow = '#f6c177'
flamingo = '#ebbcba'
blue = '#9ccfd8'
red = '#eb6f92'
overlay0 = '#6e6a86'
