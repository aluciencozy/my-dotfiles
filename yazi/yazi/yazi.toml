[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true
linemode = "size"
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1800
image_filter = "triangle"
image_quality = 80

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Neovim", for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', orphan = true, desc = "Open", for = "linux" },
]
reveal = [
  { run = 'nemo "$1"', orphan = true, desc = "Reveal in Nemo", for = "linux" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/{json,x-ndjson}", use = "edit" },
]
